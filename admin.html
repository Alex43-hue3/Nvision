<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NETVISION - Panel de Control Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Outfit', sans-serif; background-color: #07090e; color: #f3f4f6; }
        .glass-card { background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Modal de Contraseña -->
    <div id="auth-modal" class="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4">
        <div class="glass-card p-8 rounded-2xl max-w-md w-full text-center space-y-6 shadow-2xl">
            <div class="w-16 h-16 rounded-full bg-[#00e5ff]/20 text-[#00e5ff] flex items-center justify-center text-2xl mx-auto"><i class="fa-solid fa-lock"></i></div>
            <h2 class="text-2xl font-bold text-white">Panel Administrativo</h2>
            <input type="password" id="admin-pass" placeholder="Contraseña (admin123)" class="w-full px-4 py-3 rounded-xl bg-black/50 border border-white/10 text-white text-center focus:outline-none focus:border-[#00e5ff]">
            <button onclick="checkPassword()" class="w-full py-3 rounded-xl bg-[#00e5ff] text-black font-bold hover:bg-[#00c2db] transition">Acceder</button>
        </div>
    </div>

    <!-- Contenido del Panel -->
    <div id="admin-content" class="hidden flex-grow max-w-7xl mx-auto w-full p-4 md:p-8 space-y-8">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-white/10 pb-6">
            <div>
                <span class="text-xs font-bold uppercase text-[#00e5ff]">Gestión Central</span>
                <h1 class="text-3xl font-black text-white">NETVISION Control Pro</h1>
            </div>
            <div class="flex space-x-3">
                <a href="index.html" target="_blank" class="px-4 py-2 rounded-xl bg-white/10 hover:bg-white/20 text-white text-sm font-semibold flex items-center space-x-2"><i class="fa-solid fa-arrow-up-right-from-square"></i><span>Ver Plataforma</span></a>
                <button onclick="logout()" class="px-4 py-2 rounded-xl bg-red-500/20 text-red-400 text-sm font-semibold">Cerrar Sesión</button>
            </div>
        </div>

        <!-- Tarjetas de Estadísticas -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="glass-card p-5 rounded-2xl flex items-center space-x-4">
                <div class="w-12 h-12 rounded-xl bg-purple-500/20 text-purple-400 flex items-center justify-center text-xl"><i class="fa-solid fa-film"></i></div>
                <div><p class="text-xs text-gray-400">Total Películas</p><h4 id="stat-movies" class="text-2xl font-bold text-white">0</h4></div>
            </div>
            <div class="glass-card p-5 rounded-2xl flex items-center space-x-4">
                <div class="w-12 h-12 rounded-xl bg-cyan-500/20 text-cyan-400 flex items-center justify-center text-xl"><i class="fa-solid fa-clapperboard"></i></div>
                <div><p class="text-xs text-gray-400">Total Series</p><h4 id="stat-series" class="text-2xl font-bold text-white">0</h4></div>
            </div>
            <div class="glass-card p-5 rounded-2xl flex items-center space-x-4">
                <div class="w-12 h-12 rounded-xl bg-blue-500/20 text-blue-400 flex items-center justify-center text-xl"><i class="fa-solid fa-tv"></i></div>
                <div><p class="text-xs text-gray-400">Canales de TV</p><h4 id="stat-channels" class="text-2xl font-bold text-white">0</h4></div>
            </div>
        </div>

        <div class="flex space-x-2 border-b border-white/10 pb-2">
            <button onclick="switchTab('movies')" id="tab-movies" class="px-5 py-2.5 rounded-xl font-bold text-sm bg-[#00e5ff] text-black">Películas</button>
            <button onclick="switchTab('series')" id="tab-series" class="px-5 py-2.5 rounded-xl font-bold text-sm bg-white/5 text-gray-400">Series</button>
            <button onclick="switchTab('channels')" id="tab-channels" class="px-5 py-2.5 rounded-xl font-bold text-sm bg-white/5 text-gray-400">TV en Vivo</button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Formulario CRUD -->
            <div class="glass-card p-6 rounded-2xl space-y-4 h-fit">
                <h3 id="form-title" class="text-lg font-bold text-white border-b border-white/10 pb-3">Agregar Elemento</h3>
                <input type="hidden" id="edit-id" value="">
                
                <div class="space-y-3">
                    <div>
                        <label class="text-xs text-gray-400 block mb-1">Título</label>
                        <input type="text" id="item-title" class="w-full px-3 py-2.5 rounded-xl bg-black/50 border border-white/10 text-white text-sm">
                    </div>
                    <div>
                        <label class="text-xs text-gray-400 block mb-1">URL Póster</label>
                        <input type="text" id="item-poster" placeholder="https://..." class="w-full px-3 py-2.5 rounded-xl bg-black/50 border border-white/10 text-white text-sm">
                    </div>
                    <div>
                        <label class="text-xs text-gray-400 block mb-1">Género / Categoría</label>
                        <input type="text" id="item-genre" placeholder="Acción, Deportes, Drama..." class="w-full px-3 py-2.5 rounded-xl bg-black/50 border border-white/10 text-white text-sm">
                    </div>
                    <div>
                        <label class="text-xs text-gray-400 block mb-1">Sinopsis</label>
                        <textarea id="item-synopsis" rows="3" class="w-full px-3 py-2.5 rounded-xl bg-black/50 border border-white/10 text-white text-sm"></textarea>
                    </div>
                    <div>
                        <label class="text-xs text-gray-400 block mb-1">Último día disponible (Opcional)</label>
                        <input type="text" id="item-expiry" placeholder="Ej. 15 de Diciembre" class="w-full px-3 py-2.5 rounded-xl bg-black/50 border border-white/10 text-white text-sm">
                    </div>
                    <div id="field-url">
                        <label class="text-xs text-gray-400 block mb-1">URL Video / Stream</label>
                        <input type="text" id="item-url" class="w-full px-3 py-2.5 rounded-xl bg-black/50 border border-white/10 text-white text-sm">
                    </div>

                    <div id="field-series-container" class="hidden space-y-3 border-t border-white/10 pt-3">
                        <div class="flex justify-between items-center"><span class="text-xs font-bold text-[#00e5ff]">Temporadas</span><button onclick="addSeasonField()" class="px-2 py-1 bg-white/10 text-white rounded text-xs">+ Temp</button></div>
                        <div id="seasons-builder" class="space-y-3 max-h-60 overflow-y-auto"></div>
                    </div>

                    <button onclick="saveItem()" class="w-full py-3 rounded-xl bg-[#00e5ff] text-black font-bold text-sm mt-2">Guardar</button>
                    <button onclick="resetForm()" id="cancel-edit-btn" class="w-full py-2.5 rounded-xl bg-white/10 text-white text-xs hidden">Cancelar Edición</button>
                </div>
            </div>

            <!-- Listado Admin -->
            <div class="lg:col-span-2 glass-card p-6 rounded-2xl space-y-4">
                <h3 class="text-lg font-bold text-white border-b border-white/10 pb-3">Elementos Registrados</h3>
                <div id="admin-items-list" class="space-y-3 max-h-[600px] overflow-y-auto"></div>
            </div>
        </div>
    </div>

    <footer class="py-6 text-center text-xs text-gray-500 border-t border-white/5"><p>NETVISION Admin Pro &copy; 2026</p></footer>

    <script>
        let currentTab = 'movies';
        let seasonsData = [];

        function checkPassword() {
            if(document.getElementById('admin-pass').value === 'admin123') {
                document.getElementById('auth-modal').classList.add('hidden');
                document.getElementById('admin-content').classList.remove('hidden');
                loadItems();
            } else { alert('Contraseña incorrecta'); }
        }
        function logout() { location.reload(); }

        function updateStats() {
            document.getElementById('stat-movies').innerText = (JSON.parse(localStorage.getItem('netvision_movies')) || []).length;
            document.getElementById('stat-series').innerText = (JSON.parse(localStorage.getItem('netvision_series')) || []).length;
            document.getElementById('stat-channels').innerText = (JSON.parse(localStorage.getItem('netvision_channels')) || []).length;
        }

        function switchTab(tab) {
            currentTab = tab;
            ['movies', 'series', 'channels'].forEach(t => {
                document.getElementById(`tab-${t}`).className = t === tab ? 'px-5 py-2.5 rounded-xl font-bold text-sm bg-[#00e5ff] text-black' : 'px-5 py-2.5 rounded-xl font-bold text-sm bg-white/5 text-gray-400';
            });
            document.getElementById('form-title').innerText = 'Agregar ' + (tab === 'movies' ? 'Película' : tab === 'series' ? 'Serie' : 'Canal');
            const fieldUrl = document.getElementById('field-url');
            const fieldSeries = document.getElementById('field-series-container');
            if (tab === 'series') { fieldUrl.classList.add('hidden'); fieldSeries.classList.remove('hidden'); if(seasonsData.length === 0) addSeasonField(); }
            else { fieldUrl.classList.remove('hidden'); fieldSeries.classList.add('hidden'); }
            resetForm();
            loadItems();
        }

        function addSeasonField() {
            seasonsData.push({ seasonNumber: seasonsData.length + 1, episodes: [{ title: 'Episodio 1', url: '' }] });
            renderSeasonsBuilder();
        }
        function addEpisodeField(sIdx) {
            seasonsData[sIdx].episodes.push({ title: 'Episodio ' + (seasonsData[sIdx].episodes.length + 1), url: '' });
            renderSeasonsBuilder();
        }
        function renderSeasonsBuilder() {
            const container = document.getElementById('seasons-builder');
            container.innerHTML = '';
            seasonsData.forEach((season, sIdx) => {
                container.innerHTML += `
                    <div class="p-3 rounded-lg bg-black/40 border border-white/10 space-y-2">
                        <div class="flex justify-between"><span class="text-xs font-bold text-white">Temporada ${sIdx + 1}</span><button onclick="addEpisodeField(${sIdx})" class="text-[10px] text-[#00e5ff]">+ Ep</button></div>
                        ${season.episodes.map((ep, eIdx) => `
                            <div class="flex space-x-2">
                                <input type="text" value="${ep.title}" onchange="seasonsData[${sIdx}].episodes[${eIdx}].title=this.value" class="w-1/3 px-2 py-1 rounded bg-black/50 border text-xs text-white">
                                <input type="text" value="${ep.url}" onchange="seasonsData[${sIdx}].episodes[${eIdx}].url=this.value" class="w-2/3 px-2 py-1 rounded bg-black/50 border text-xs text-white" placeholder="URL ep">
                            </div>
                        `).join('')}
                    </div>
                `;
            });
        }

        function getStorageKey() { return currentTab === 'movies' ? 'netvision_movies' : currentTab === 'series' ? 'netvision_series' : 'netvision_channels'; }

        function saveItem() {
            const id = document.getElementById('edit-id').value || 'id_' + Date.now();
            const title = document.getElementById('item-title').value;
            const poster = document.getElementById('item-poster').value;
            const genre = document.getElementById('item-genre').value;
            const synopsis = document.getElementById('item-synopsis').value;
            const expiryDate = document.getElementById('item-expiry').value;
            const url = document.getElementById('item-url').value;

            if(!title) { alert('Ingrese al menos el título'); return; }

            const newItem = { id, title, poster, genre, synopsis, expiryDate, url: currentTab !== 'series' ? url : '', seasons: currentTab === 'series' ? seasonsData : undefined };
            const key = getStorageKey();
            let list = JSON.parse(localStorage.getItem(key) || '[]');
            const idx = list.findIndex(i => i.id === id);
            if(idx >= 0) { list[idx] = newItem; } else { list.push(newItem); }
            localStorage.setItem(key, JSON.stringify(list));

            resetForm();
            loadItems();
            alert('¡Guardado correctamente!');
        }

        function loadItems() {
            updateStats();
            const key = getStorageKey();
            const list = JSON.parse(localStorage.getItem(key) || '[]');
            const container = document.getElementById('admin-items-list');
            container.innerHTML = '';
            if(list.length === 0) { container.innerHTML = '<p class="text-xs text-gray-500 text-center py-6">No hay elementos registrados.</p>'; return; }

            list.forEach(item => {
                container.innerHTML += `
                    <div class="flex items-center justify-between p-3 rounded-xl bg-black/40 border border-white/5">
                        <div class="flex items-center space-x-3">
                            <img src="${item.poster}" class="w-10 h-14 object-cover rounded">
                            <div><h4 class="text-sm font-bold text-white">${item.title}</h4><span class="text-xs text-gray-400">${item.genre || ''}</span></div>
                        </div>
                        <div class="flex space-x-2">
                            <button onclick='editItem(${JSON.stringify(item)})' class="px-3 py-1.5 rounded-lg bg-blue-500/20 text-blue-400 text-xs font-semibold">Editar</button>
                            <button onclick="deleteItem('${key}', '${item.id}')" class="px-3 py-1.5 rounded-lg bg-red-500/20 text-red-400 text-xs font-semibold">Eliminar</button>
                        </div>
                    </div>
                `;
            });
        }

        function editItem(item) {
            document.getElementById('edit-id').value = item.id;
            document.getElementById('item-title').value = item.title || '';
            document.getElementById('item-poster').value = item.poster || '';
            document.getElementById('item-genre').value = item.genre || '';
            document.getElementById('item-synopsis').value = item.synopsis || '';
            document.getElementById('item-expiry').value = item.expiryDate || '';
            document.getElementById('item-url').value = item.url || '';
            if(item.seasons) { seasonsData = item.seasons; renderSeasonsBuilder(); }
            document.getElementById('form-title').innerText = 'Editando Elemento';
            document.getElementById('cancel-edit-btn').classList.remove('hidden');
        }

        function resetForm() {
            document.getElementById('edit-id').value = '';
            document.getElementById('item-title').value = '';
            document.getElementById('item-poster').value = '';
            document.getElementById('item-genre').value = '';
            document.getElementById('item-synopsis').value = '';
            document.getElementById('item-expiry').value = '';
            document.getElementById('item-url').value = '';
            seasonsData = [];
            document.getElementById('form-title').innerText = 'Agregar Elemento';
            document.getElementById('cancel-edit-btn').classList.add('hidden');
            if(currentTab === 'series') addSeasonField();
        }

        function deleteItem(key, id) {
            if(!confirm('¿Desea eliminar este elemento?')) return;
            let list = JSON.parse(localStorage.getItem(key) || '[]');
            list = list.filter(i => i.id !== id);
            localStorage.setItem(key, JSON.stringify(list));
            loadItems();
        }
    </script>
</body>
</html>
