<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NETVISION - Panel de Administración</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Outfit', sans-serif; background-color: #0b0f19; color: #f3f4f6; }
        .glass-card { background: rgba(17, 24, 39, 0.8); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Modal de Contraseña de Administrador -->
    <div id="auth-modal" class="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4">
        <div class="glass-card p-8 rounded-2xl max-w-md w-full text-center space-y-6 shadow-2xl">
            <div class="w-16 h-16 rounded-full bg-[#00e5ff]/20 text-[#00e5ff] flex items-center justify-center text-2xl mx-auto">
                <i class="fa-solid fa-lock"></i>
            </div>
            <div>
                <h2 class="text-2xl font-bold text-white mb-2">Panel de Control</h2>
                <p class="text-xs text-gray-400">Ingresa la contraseña de administrador para continuar.</p>
            </div>
            <input type="password" id="admin-pass" placeholder="Contraseña (admin123)" class="w-full px-4 py-3 rounded-xl bg-black/50 border border-white/10 text-white text-center focus:outline-none focus:border-[#00e5ff]">
            <button onclick="checkPassword()" class="w-full py-3 rounded-xl bg-[#00e5ff] text-black font-bold hover:bg-[#00c2db] transition">Acceder al Panel</button>
            <p class="text-[10px] text-gray-500">Contraseña por defecto: <span class="text-white font-mono">admin123</span></p>
        </div>
    </div>

    <!-- Contenido Principal del Panel -->
    <div id="admin-content" class="hidden flex-grow flex flex-col max-w-7xl mx-auto w-full p-4 md:p-8 space-y-8">
        
        <!-- Header del Panel -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-white/10 pb-6">
            <div>
                <span class="text-xs font-bold uppercase tracking-widest text-[#00e5ff]">Administración</span>
                <h1 class="text-3xl font-extrabold text-white">NETVISION Control Panel</h1>
            </div>
            <div class="flex items-center space-x-3">
                <a href="index.html" target="_blank" class="px-4 py-2 rounded-xl bg-white/10 hover:bg-white/20 text-white text-sm font-semibold transition flex items-center space-x-2">
                    <i class="fa-solid fa-arrow-up-right-from-square"></i>
                    <span>Ver Plataforma</span>
                </a>
                <button onclick="logout()" class="px-4 py-2 rounded-xl bg-red-500/20 hover:bg-red-500/30 text-red-400 text-sm font-semibold transition">
                    Cerrar Sesión
                </button>
            </div>
        </div>

        <!-- Pestañas de Gestión -->
        <div class="flex space-x-2 border-b border-white/10 pb-2">
            <button onclick="switchTab('movies')" id="tab-movies" class="px-5 py-2.5 rounded-xl font-bold text-sm bg-[#00e5ff] text-black transition">Películas</button>
            <button onclick="switchTab('series')" id="tab-series" class="px-5 py-2.5 rounded-xl font-bold text-sm bg-white/5 text-gray-400 hover:bg-white/10 hover:text-white transition">Series</button>
            <button onclick="switchTab('channels')" id="tab-channels" class="px-5 py-2.5 rounded-xl font-bold text-sm bg-white/5 text-gray-400 hover:bg-white/10 hover:text-white transition">TV en Vivo</button>
        </div>

        <!-- Sección de Formularios y Listados -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Formulario de Creación -->
            <div class="glass-card p-6 rounded-2xl space-y-4 h-fit">
                <h3 id="form-title" class="text-lg font-bold text-white border-b border-white/10 pb-3">Agregar Película</h3>
                
                <div class="space-y-3">
                    <div>
                        <label class="text-xs text-gray-400 block mb-1">Título</label>
                        <input type="text" id="item-title" class="w-full px-3 py-2 rounded-lg bg-black/50 border border-white/10 text-white text-sm focus:outline-none focus:border-[#00e5ff]">
                    </div>
                    <div>
                        <label class="text-xs text-gray-400 block mb-1">URL de la Portada (Poster Image)</label>
                        <input type="text" id="item-poster" placeholder="https://..." class="w-full px-3 py-2 rounded-lg bg-black/50 border border-white/10 text-white text-sm focus:outline-none focus:border-[#00e5ff]">
                    </div>
                    <div>
                        <label class="text-xs text-gray-400 block mb-1">Género / Categoría</label>
                        <input type="text" id="item-genre" placeholder="Acción, Drama..." class="w-full px-3 py-2 rounded-lg bg-black/50 border border-white/10 text-white text-sm focus:outline-none focus:border-[#00e5ff]">
                    </div>
                    
                    <!-- Campo URL para Películas y TV -->
                    <div id="field-url">
                        <label class="text-xs text-gray-400 block mb-1">URL del Video / Stream (MP4, YouTube, M3U8)</label>
                        <input type="text" id="item-url" placeholder="https://..." class="w-full px-3 py-2 rounded-lg bg-black/50 border border-white/10 text-white text-sm focus:outline-none focus:border-[#00e5ff]">
                    </div>

                    <!-- Gestor de Temporadas y Episodios (Solo para Series) -->
                    <div id="field-series-container" class="hidden space-y-3 border-t border-white/10 pt-3">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-bold text-[#00e5ff]">Temporadas y Episodios</span>
                            <button onclick="addSeasonField()" class="px-2 py-1 bg-white/10 hover:bg-white/20 text-white rounded text-xs">+ Temp</button>
                        </div>
                        <div id="seasons-builder" class="space-y-3 max-h-60 overflow-y-auto pr-1">
                            <!-- Se generan dinámicamente -->
                        </div>
                    </div>

                    <button onclick="saveItem()" class="w-full py-2.5 rounded-xl bg-[#00e5ff] text-black font-bold text-sm hover:bg-[#00c2db] transition mt-2">Guardar Elemento</button>
                </div>
            </div>

            <!-- Listado de Elementos Actuales -->
            <div class="lg:col-span-2 glass-card p-6 rounded-2xl space-y-4">
                <h3 class="text-lg font-bold text-white border-b border-white/10 pb-3">Elementos Registrados</h3>
                <div id="admin-items-list" class="space-y-3 max-h-[600px] overflow-y-auto pr-2">
                    <!-- Se listan dinámicamente -->
                </div>
            </div>

        </div>

    </div>

    <footer class="py-6 text-center text-xs text-gray-500 border-t border-white/5">
        <p>NETVISION Admin Panel &copy; 2026</p>
    </footer>

    <script>
        let currentTab = 'movies';
        let seasonsData = [];

        function checkPassword() {
            const pass = document.getElementById('admin-pass').value;
            if (pass === 'admin123') {
                document.getElementById('auth-modal').classList.add('hidden');
                document.getElementById('admin-content').classList.remove('hidden');
                loadItems();
            } else {
                alert('Contraseña incorrecta.');
            }
        }

        function logout() {
            document.getElementById('auth-modal').classList.remove('hidden');
            document.getElementById('admin-content').classList.add('hidden');
            document.getElementById('admin-pass').value = '';
        }

        function switchTab(tab) {
            currentTab = tab;
            ['movies', 'series', 'channels'].forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                if (t === tab) {
                    btn.className = 'px-5 py-2.5 rounded-xl font-bold text-sm bg-[#00e5ff] text-black transition';
                } else {
                    btn.className = 'px-5 py-2.5 rounded-xl font-bold text-sm bg-white/5 text-gray-400 hover:bg-white/10 hover:text-white transition';
                }
            });

            document.getElementById('form-title').innerText = tab === 'movies' ? 'Agregar Película' : tab === 'series' ? 'Agregar Serie' : 'Agregar Canal de TV';
            
            const fieldUrl = document.getElementById('field-url');
            const fieldSeries = document.getElementById('field-series-container');
            
            if (tab === 'series') {
                fieldUrl.classList.add('hidden');
                fieldSeries.classList.remove('hidden');
                if (seasonsData.length === 0) addSeasonField();
            } else {
                fieldUrl.classList.remove('hidden');
                fieldSeries.classList.add('hidden');
            }

            loadItems();
        }

        function addSeasonField() {
            seasonsData.push({ seasonNumber: seasonsData.length + 1, episodes: [{ title: 'Episodio 1', url: '' }] });
            renderSeasonsBuilder();
        }

        function addEpisodeField(sIdx) {
            seasonsData[sIdx].episodes.push({ title: 'Episodio ' + (seasonsData[sIdx].episodes.length + 1), url: '' });
            renderSeasonsBuilder();
        }

        function renderSeasonsBuilder() {
            const container = document.getElementById('seasons-builder');
            container.innerHTML = '';
            seasonsData.forEach((season, sIdx) => {
                const sDiv = document.createElement('div');
                sDiv.className = 'p-3 rounded-lg bg-black/40 border border-white/10 space-y-2';
                sDiv.innerHTML = `
                    <div class="flex justify-between items-center">
                        <span class="text-xs font-bold text-white">Temporada ${sIdx + 1}</span>
                        <button onclick="addEpisodeField(${sIdx})" class="text-[10px] bg-cyan-500/20 text-[#00e5ff] px-2 py-0.5 rounded">+ Episodio</button>
                    </div>
                    <div class="space-y-2 episodes-container-${sIdx}">
                        ${season.episodes.map((ep, eIdx) => `
                            <div class="flex space-x-2">
                                <input type="text" placeholder="Título ep" value="${ep.title}" onchange="updateEp(${sIdx}, ${eIdx}, 'title', this.value)" class="w-1/3 px-2 py-1 rounded bg-black/50 border border-white/10 text-xs text-white">
                                <input type="text" placeholder="URL video ep" value="${ep.url}" onchange="updateEp(${sIdx}, ${eIdx}, 'url', this.value)" class="w-2/3 px-2 py-1 rounded bg-black/50 border border-white/10 text-xs text-white">
                            </div>
                        `).join('')}
                    </div>
                `;
                container.appendChild(sDiv);
            });
        }

        function updateEp(sIdx, eIdx, field, val) {
            seasonsData[sIdx].episodes[eIdx][field] = val;
        }

        function getStorageKey() {
            return currentTab === 'movies' ? 'netvision_movies' : currentTab === 'series' ? 'netvision_series' : 'netvision_channels';
        }

        function saveItem() {
            const title = document.getElementById('item-title').value;
            const poster = document.getElementById('item-poster').value;
            const genre = document.getElementById('item-genre').value;
            const url = document.getElementById('item-url').value;

            if (!title) {
                alert('Por favor, ingresa al menos el título.');
                return;
            }

            const newItem = {
                id: 'id_' + Date.now(),
                title,
                poster,
                genre,
                url: currentTab !== 'series' ? url : '',
                seasons: currentTab === 'series' ? seasonsData : undefined
            };

            const key = getStorageKey();
            let list = [];
            try { list = JSON.parse(localStorage.getItem(key)) || []; } catch(e) {}
            list.push(newItem);
            localStorage.setItem(key, JSON.stringify(list));

            // Limpiar formulario
            document.getElementById('item-title').value = '';
            document.getElementById('item-poster').value = '';
            document.getElementById('item-genre').value = '';
            document.getElementById('item-url').value = '';
            seasonsData = [];
            if (currentTab === 'series') addSeasonField();

            alert('¡Guardado con éxito!');
            loadItems();
        }

        function loadItems() {
            const key = getStorageKey();
            let list = [];
            try { list = JSON.parse(localStorage.getItem(key)) || []; } catch(e) {}
            
            const listContainer = document.getElementById('admin-items-list');
            listContainer.innerHTML = '';

            if (list.length === 0) {
                listContainer.innerHTML = `<p class="text-xs text-gray-500 text-center py-6">No hay elementos registrados en esta sección.</p>`;
                return;
            }

            list.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'flex items-center justify-between p-3 rounded-xl bg-black/40 border border-white/5';
                div.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <img src="${item.poster || 'https://images.unsplash.com/photo-1485846234645-a62644f84728?q=80&w=100'}" class="w-10 h-14 object-cover rounded">
                        <div>
                            <h4 class="text-sm font-bold text-white">${item.title}</h4>
                            <span class="text-xs text-gray-400">${item.genre || 'General'}</span>
                        </div>
                    </div>
                    <button onclick="deleteItem('${key}', '${item.id}')" class="px-3 py-1.5 rounded-lg bg-red-500/20 text-red-400 hover:bg-red-500/30 text-xs font-semibold transition">
                        Eliminar
                    </button>
                `;
                listContainer.appendChild(div);
            });
        }

        function deleteItem(key, id) {
            if (!confirm('¿Estás seguro de eliminar este elemento?')) return;
            let list = [];
            try { list = JSON.parse(localStorage.getItem(key)) || []; } catch(e) {}
            list = list.filter(item => item.id !== id);
            localStorage.setItem(key, JSON.stringify(list));
            loadItems();
        }
    </script>
</body>
</html>
